<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CMC Terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0d0e14; }
  #term { position: absolute; inset: 0; padding: 8px; box-sizing: border-box; }
  #status {
    position: fixed; top: 6px; right: 12px; font: 12px monospace; color: #666;
    z-index: 10;
  }
  #status.ok { color: #3fb950; }
  #status.err { color: #f85149; }
  #startOverlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0d0e14; z-index: 20;
  }
  #startBox { display: flex; flex-direction: column; gap: 10px; width: min(90vw, 420px); }
  #tokenInput {
    font: 14px monospace; color: #ddd; background: #1b1d27; border: 1px solid #333;
    border-radius: 6px; padding: 10px 12px; outline: none;
  }
  #tokenInput:focus { border-color: #3fb950; }
  #startBtn {
    font: 16px monospace; color: #0d0e14; background: #3fb950; border: none;
    padding: 14px 28px; border-radius: 6px; cursor: pointer;
  }
  #startBtn:disabled { opacity: 0.5; cursor: default; }
  #startBtn:hover:not(:disabled) { background: #56d364; }
  #inputErr { font: 12px monospace; color: #f85149; min-height: 14px; }
</style>
</head>
<body>
<div id="status"></div>
<div id="startOverlay">
  <div id="startBox">
    <input id="tokenInput" type="text" placeholder="Enter your access token yoki to'liq URL" autocomplete="off" />
    <div id="inputErr"></div>
    <button id="startBtn">Start session</button>
  </div>
</div>
<div id="term"></div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.18.0/lib/addon-webgl.min.js"></script>
<script>
const statusEl = document.getElementById("status");
const setStatus = (text, cls) => { statusEl.textContent = text; statusEl.className = cls || ""; };

const term = new Terminal({
  cursorBlink: true,
  fontFamily: "Menlo, Consolas, monospace",
  fontSize: 14,
  theme: { background: "#0d0e14" },
  scrollback: 5000,
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById("term"));

// WebGL renderer — GPU orqali chizadi, katta oqim (masalan `cat bigfile` yoki build log)
// paytida ham UI qotib qolmaydi. Bu web terminalning tezligi uchun eng muhim qism.
try {
  term.loadAddon(new WebglAddon.WebglAddon());
} catch (e) {
  console.warn("WebGL yoqilmadi, oddiy renderer ishlatiladi", e);
}

fitAddon.fit();
window.addEventListener("resize", () => fitAddon.fit());

const startOverlay = document.getElementById("startOverlay");
const startBtn = document.getElementById("startBtn");
const tokenInput = document.getElementById("tokenInput");
const inputErr = document.getElementById("inputErr");
let ws = null;

// Kiritilgan qiymatdan (to'liq URL yoki yalang'och token) ws manzilini quramiz.
// Qo'llab-quvvatlanadigan shakllar:
//   https://domen.dev/mcp?token=XXXX                       -> domendan host, tokendan XXXX
//   https://cmcomputer.vercel.app/?ws=wss://domen.dev&token=XXXX  -> ws= ichidagi domen ishlatiladi
//   XXXX (faqat token)                                      -> joriy sahifa hosti ishlatiladi
function buildWsUrl(raw) {
  raw = raw.trim();
  if (!raw) return null;

  let host = location.host;
  let proto = location.protocol === "https:" ? "wss:" : "ws:";
  let token = raw;

  try {
    const u = new URL(raw);
    const qToken = u.searchParams.get("token");
    const qWs = u.searchParams.get("ws");

    if (qWs) {
      // Eski uslub: haqiqiy backend manzili "ws=" parametri ichida.
      const inner = new URL(/^\w+:\/\//.test(qWs) ? qWs : `wss://${qWs}`);
      host = inner.host;
      proto = inner.protocol === "https:" || inner.protocol === "wss:" ? "wss:" : "ws:";
    } else {
      host = u.host;
      proto = u.protocol === "https:" || u.protocol === "wss:" ? "wss:" : "ws:";
    }

    if (qToken) token = qToken;
  } catch (e) {
    // URL emas — demak yalang'och token kiritilgan, hostni o'zgartirmaymiz.
  }

  return `${proto}//${host}/?token=${encodeURIComponent(token)}`;
}

// Sahifa ochilganda ULANMAYDI — faqat tugma bosilganda session boshlanadi.
startBtn.addEventListener("click", startSession);
tokenInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") startSession();
});

function startSession() {
  inputErr.textContent = "";
  const wsUrl = buildWsUrl(tokenInput.value);
  if (!wsUrl) {
    inputErr.textContent = "Token yoki URL kiritilmadi.";
    return;
  }

  startBtn.disabled = true;
  startBtn.textContent = "Ulanmoqda...";
  setStatus("ulanmoqda...", "");

  ws = new WebSocket(wsUrl);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    startOverlay.remove();
    setStatus("ulandi", "ok");
    fitAddon.fit();
    sendResize();
  };

  ws.onclose = (e) => {
    setStatus(e.code === 4001 ? "token xato" : "uzildi", "err");
    resetToStart();
  };

  ws.onerror = () => setStatus("xato", "err");

  // server -> terminal: darhol yoz, kutmasdan (backpressure'ni brauzer o'zi boshqaradi)
  ws.onmessage = (ev) => {
    const data = typeof ev.data === "string" ? ev.data : new Uint8Array(ev.data);
    term.write(data);
  };
}

function resetToStart() {
  // Ulanish uzilsa, qayta "Start session" tugmasini ko'rsatamiz.
  startBtn.disabled = false;
  startBtn.textContent = "Start session";
  if (!document.body.contains(startOverlay)) document.body.appendChild(startOverlay);
}

// terminal -> server: har bosilgan tugma darhol jo'natiladi, kechikishsiz
term.onData((data) => {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(data);
});

function sendResize() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(`\x01${term.cols},${term.rows}`);
  }
}
term.onResize(sendResize);
</script>
</body>
</html>
