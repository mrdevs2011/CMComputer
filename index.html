<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CMC Terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0d0e14; }
  #term { position: absolute; inset: 0; padding: 8px; box-sizing: border-box; }
  #status {
    position: fixed; top: 6px; right: 12px; font: 12px monospace; color: #666;
    z-index: 10;
  }
  #status.ok { color: #3fb950; }
  #status.err { color: #f85149; }
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0d0e14; z-index: 20;
  }
  .box { display: flex; flex-direction: column; gap: 10px; width: min(90vw, 340px); }
  .box input {
    font: 14px monospace; color: #ddd; background: #1b1d27; border: 1px solid #333;
    border-radius: 6px; padding: 10px 12px; outline: none;
  }
  .box input:focus { border-color: #3fb950; }
  .box button {
    font: 16px monospace; color: #0d0e14; background: #3fb950; border: none;
    padding: 14px 28px; border-radius: 6px; cursor: pointer;
  }
  .box button:disabled { opacity: 0.5; cursor: default; }
  .box button:hover:not(:disabled) { background: #56d364; }
  .err { font: 12px monospace; color: #f85149; min-height: 14px; }
</style>
</head>
<body>
<div id="status"></div>

<div id="loginOverlay" class="overlay">
  <div class="box">
    <input id="passwordInput" type="password" placeholder="Parol" autocomplete="current-password" />
    <div id="loginErr" class="err"></div>
    <button id="loginBtn">Kirish</button>
  </div>
</div>

<div id="startOverlay" class="overlay" style="display:none">
  <div class="box">
    <button id="startBtn">Start session</button>
  </div>
</div>

<div id="term"></div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.18.0/lib/addon-webgl.min.js"></script>
<script>
const statusEl = document.getElementById("status");
const setStatus = (text, cls) => { statusEl.textContent = text; statusEl.className = cls || ""; };

const term = new Terminal({
  cursorBlink: true,
  fontFamily: "Menlo, Consolas, monospace",
  fontSize: 14,
  theme: { background: "#0d0e14" },
  scrollback: 5000,
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById("term"));

// WebGL renderer — GPU orqali chizadi, katta oqim (masalan `cat bigfile` yoki build log)
// paytida ham UI qotib qolmaydi. Bu web terminalning tezligi uchun eng muhim qism.
try {
  term.loadAddon(new WebglAddon.WebglAddon());
} catch (e) {
  console.warn("WebGL yoqilmadi, oddiy renderer ishlatiladi", e);
}

fitAddon.fit();
window.addEventListener("resize", () => fitAddon.fit());

const loginOverlay = document.getElementById("loginOverlay");
const passwordInput = document.getElementById("passwordInput");
const loginBtn = document.getElementById("loginBtn");
const loginErr = document.getElementById("loginErr");

const startOverlay = document.getElementById("startOverlay");
const startBtn = document.getElementById("startBtn");

let ws = null;
// Parol to'g'ri kelgach, backend host/token shu yerda (faqat xotirada) saqlanadi —
// hech qanday localStorage yoki sahifa manbasida yozilmaydi.
let backendHost = null;
let backendToken = null;

// ---- 1-qadam: parol bilan kirish (/api/login orqali server tekshiradi) ----
async function login() {
  loginErr.textContent = "";
  const password = passwordInput.value;
  if (!password) {
    loginErr.textContent = "Parol kiriting.";
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Tekshirilmoqda...";

  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password }),
    });
    const data = await res.json();

    if (!res.ok) {
      loginErr.textContent = data.error || "Parol xato.";
      loginBtn.disabled = false;
      loginBtn.textContent = "Kirish";
      return;
    }

    backendHost = data.host;
    backendToken = data.token;
    passwordInput.value = "";
    loginOverlay.style.display = "none";
    startOverlay.style.display = "flex";
  } catch (e) {
    loginErr.textContent = "Server bilan bog'lanib bo'lmadi.";
    loginBtn.disabled = false;
    loginBtn.textContent = "Kirish";
  }
}

loginBtn.addEventListener("click", login);
passwordInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") login();
});

// ---- 2-qadam: WebSocket session (host/token /api/login'dan kelgan) ----
// Sahifa ochilganda ULANMAYDI — parol tasdiqlangach ham faqat tugma bosilganda ulanadi.
startBtn.addEventListener("click", startSession);

function startSession() {
  if (!backendHost || !backendToken) return;

  startBtn.disabled = true;
  startBtn.textContent = "Ulanmoqda...";
  setStatus("ulanmoqda...", "");

  const wsUrl = `wss://${backendHost}/?token=${encodeURIComponent(backendToken)}`;
  ws = new WebSocket(wsUrl);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    startOverlay.style.display = "none";
    setStatus("ulandi", "ok");
    fitAddon.fit();
    sendResize();
  };

  ws.onclose = (e) => {
    setStatus(e.code === 4001 ? "token xato" : "uzildi", "err");
    resetToStart();
  };

  ws.onerror = () => setStatus("xato", "err");

  // server -> terminal: darhol yoz, kutmasdan (backpressure'ni brauzer o'zi boshqaradi)
  ws.onmessage = (ev) => {
    const data = typeof ev.data === "string" ? ev.data : new Uint8Array(ev.data);
    term.write(data);
  };
}

function resetToStart() {
  // Ulanish uzilsa, qayta "Start session" tugmasini ko'rsatamiz (parolni qayta so'ramaydi).
  startBtn.disabled = false;
  startBtn.textContent = "Start session";
  startOverlay.style.display = "flex";
}

// terminal -> server: har bosilgan tugma darhol jo'natiladi, kechikishsiz
term.onData((data) => {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(data);
});

function sendResize() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(`\x01${term.cols},${term.rows}`);
  }
}
term.onResize(sendResize);
</script>
</body>
</html>
